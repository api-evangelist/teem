name: Teem
description: >-
  Teem is a workplace and meeting-room management platform for booking
  conference rooms and desks, coordinating spaces, and analyzing workplace
  utilization. Its product surface includes EventBoard room-display scheduling,
  LobbyConnect visitor management, desk and space booking, calendar
  integrations (Office 365, Google, Exchange), mobile and desktop apps, email
  plugins, and workplace analytics. Originally an independent, GV-backed company
  (formerly EventBoard), Teem was acquired by iOFFICE and is now delivered as
  part of Eptura's workplace portfolio. Teem historically exposed a developer
  API and webhooks for custom booking and provisioning workflows; developer and
  API access is now managed through the Eptura customer portal and Knowledge
  Center.
